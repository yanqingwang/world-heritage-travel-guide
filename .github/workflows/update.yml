name: Update data and deploy

on:
  schedule:
    # Every Monday at 03:17 UTC (11:17 Beijing time).
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      budget:
        description: "OSM sites to refresh this run (0 = every stale site)"
        default: "80"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: heritage-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh sources and rebuild
        env:
          # Optional: enables UNESCO's Cloudflare-protected XML editions.
          # Without it the job tries a direct fetch and falls back to the
          # committed snapshot, so the build never breaks.
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          BUDGET: ${{ github.event.inputs.budget || '80' }}
        run: python scripts/update_all.py --budget "$BUDGET"

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "chore(data): weekly heritage data update"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
